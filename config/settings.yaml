# trust-lab settings. Edit here, not in code.
seed: 42
train_ratio: 0.8

# Generation
max_tokens: 400
temperature: 0.0

# Retry / rate limiting (conservative defaults; tighten after reading each console)
retries: 3
retry_backoff_seconds: 2
requests_per_minute: 20

# Caching / logging / output
cache_enabled: true
cache_dir: cache
log_dir: logs
results_dir: results

# Paths
data_dir: data
questions_file: data/questions/seed_questions.jsonl
splits_dir: data/splits
train_file: data/splits/train.jsonl
test_file: data/splits/test.jsonl

# Experiment
prompt_styles: [direct, think_step_by_step, concise]
self_consistency_samples: 5
abstain_option: true
numeric_tolerance: 0.01

# Output
save_raw_responses: true
